<!--LOGIN-->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Nexus | Login</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>
    <main class="login_container">
        <!-- LADO ESQUERDO -->
        <div class="lado_esquerdo">
            <a href="./index.html" class="botao_de_voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="card-login">
                <h2>Login</h2>
                <div class="linha-dupla">
                    <div class="campo">
                        <label>Email</label>
                        <input type="text" id="email_input" placeholder="empresa@email.com">
                    </div>
                    <div class="campo">
                        <label>Senha</label>
                        <div class="input-icone">
                            <input type="password" id="senha_input" placeholder="**********">
                            <i class="fa-solid fa-eye" onclick="toggleSenha(this)"></i>
                        </div>
                    </div>
                </div>

                <button onclick="entrar()">Login</button>

                <span class="sub">
                    Não possui conta? <a href="./cadastroEmpresa.html">Cadastre-se</a>
                </span>
                <div id="erro" class="mensagem_senha"></div>
                <div id="alerta_custom" class="alerta">
                    <div class="alerta_box">
                        <p id="alerta_msg"></p>
                        <button onclick="fecharAlerta()">OK</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- LADO DIREITO -->
        <div class="lado_direito">
            <div>
                <img src="assets/LogoBranca.png" class="logo">
                <h1>Bem-vindo de volta</h1>
                <p>Continue gerenciando sua instituição com eficiência.</p>
            </div>
        </div>
    </main>
</body>

</html>

<script>

    // Função do olhinho
    function toggleSenha() {
        const senha = document.getElementById('senha_input');
        const icon = document.querySelector('.olhinho i');
        if (senha.type === 'password') {
            senha.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            senha.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    function mostrarAlerta(msg) {
        const alerta = document.getElementById("alerta_custom");
        const texto = document.getElementById("alerta_msg");

        texto.innerText = msg;
        alerta.classList.add("ativo");
    }

    function fecharAlerta() {
        document.getElementById("alerta_custom").classList.remove("ativo");
    }

    const emailInput = document.getElementById("email_input");
    const senhaInput = document.getElementById("senha_input");
    const erroDiv = document.getElementById("erro");


    async function entrar() {
        let email = emailInput.value.trim();
        let senha = senhaInput.value;

        if (email === "" || senha === "") {
            mostrarAlerta("Preencha todos os campos obrigatórios.");

            if (email === "") {
                emailInput.style.border = "1px solid #e63946";
            }

            if (senha === "") {
                senhaInput.style.border = "1px solid #e63946";
            }

            return;
        }

        try {
            const resposta = await fetch("http://localhost:3333/diretoria/autenticar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            });

            if (resposta.status === 200) {
                const dados = await resposta.json();

                sessionStorage.setItem("ID_DIRETOR", dados.id);
                sessionStorage.setItem("NOME_DIRETOR", dados.nome);
                sessionStorage.setItem("EMAIL_DIRETOR", dados.email);
                sessionStorage.setItem("FK_UNIVERSIDADE", dados.universidade);

                window.location.href = "/dashboard/dashboard.html";

            } else if (resposta.status === 401) {
                erroDiv.style.color = "red";
                erroDiv.innerText = "Email ou senha inválidos.";
            } else {
                const msg = await resposta.text();
                erroDiv.style.color = "red";
                erroDiv.innerText = "Erro: " + msg;
            }

        } catch (erro) {
            console.error(erro);
            erroDiv.style.color = "red";
            erroDiv.innerText = "Não foi possível conectar ao servidor.";
        }
    }
</script>
