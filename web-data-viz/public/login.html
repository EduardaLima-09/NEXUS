<!--LOGIN-->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Nexus | Login</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>
    <main class="login_container">
        <!-- LADO ESQUERDO -->
        <div class="lado_esquerdo">
            <a href="./index.html" class="botao_de_voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="card-login">
                <h2>Login</h2>
                <div class="linha-dupla">
                    <div class="campo">
                        <label>Email</label>
                        <input type="text" id="email_input" placeholder="empresa@email.com">
                    </div>
                    <div class="campo">
                        <label>Senha</label>
                        <div class="input-icone">
                            <input type="password" id="senha_input" placeholder="**********">
                            <i class="fa-solid fa-eye" onclick="toggleSenha(this)"></i>
                        </div>
                    </div>
                </div>

                <button onclick="entrar()">Login</button>

                <span class="sub">
                    Não possui conta? <a href="./cadastroEmpresa.html">Cadastre-se</a>
                </span>
                <div id="erro" class="mensagem_senha"></div>

                <!-- Alert -->
                <div id="customAlert" class="alerta">
                    <div class="alerta-container">
                        <div class="alerta-header">
                            <div id="alertIcon" class="alerta-icone"></div>
                            <h3 id="alertTitle"></h3>
                        </div>
                        <div class="alerta-mensagem">
                            <p id="alertMessage"></p>
                            <div id="tokenContainer" style="display: none;"></div>
                        </div>
                        <div class="alerta-butoes">
                            <button class="alert-btn primary" onclick="closeAlert()">OK</button>
                        </div>
                    </div>
                </div>

                <!--Carregamento-->
                <div id="customLoader" class="carregando">
                    <div class="carregando-container">
                        <div class="parte-texto"></div>
                        <p>Processando cadastro...</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- LADO DIREITO -->
        <div class="lado_direito">
            <div>
                <img src="assets/LogoBranca.png" class="logo">
                <h1>Bem-vindo de volta</h1>
                <p>Continue gerenciando sua instituição com eficiência.</p>
            </div>
        </div>
    </main>
</body>
<script>
    const emailInput = document.getElementById("email_input");
    const senhaInput = document.getElementById("senha_input");
    const erroDiv = document.getElementById("erro");

    // Funções do alert personalizado
    function showAlert(type, title, message, redirectUrl = null) {
        const alert = document.getElementById('customAlert');
        const alertIcon = document.getElementById('alertIcon');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');

        // Configurar ícone e cor baseado no tipo, resolve essa parte no css também
        alertIcon.innerHTML = '';
        if (type === 'success') {
            alertIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
            alertIcon.className = 'alerta-icone success';
        } else if (type === 'error') {
            alertIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            alertIcon.className = 'alerta-icone error';
        } else if (type === 'warning') {
            alertIcon.innerHTML = '<i class="fa-solid fa-exclamation"></i>';
            alertIcon.className = 'alerta-icone warning';
        } else {
            alertIcon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
            alertIcon.className = 'alerta-icone info';
        }

        alertTitle.textContent = title;
        alertMessage.textContent = message;

        alert.classList.add('active');

        // Se tiver URL de redirecionamento, redirecionar após fechar
        if (redirectUrl) {
            const closeBtn = document.querySelector('#customAlert .alert-btn.primary');
            const oldClick = closeBtn.onclick;
            closeBtn.onclick = () => {
                if (oldClick) oldClick();
                window.location.href = redirectUrl;
            };
        }
    }

    function showLoader() {
        document.getElementById('customLoader').classList.add('active');
    }

    function hideLoader() {
        document.getElementById('customLoader').classList.remove('active');
    }

    // Função para validar email
    function validarEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }

    async function entrar() {
        let email = emailInput.value.trim();
        let senha = senhaInput.value;
        let camposInvalidos = false;

        // Limpar estilos anteriores
        emailInput.classList.remove('input-error');
        senhaInput.classList.remove('input-error');
        emailInput.style.border = "";
        senhaInput.style.border = "";
        erroDiv.innerHTML = "";

        // Validação dos campos
        if (email === "") {
            emailInput.classList.add('input-error');
            emailInput.style.border = "1px solid #f44336";
            camposInvalidos = true;
        }

        if (senha === "") {
            senhaInput.classList.add('input-error');
            senhaInput.style.border = "1px solid #f44336";
            camposInvalidos = true;
        }

        if (email !== "" && !validarEmail(email)) {
            emailInput.classList.add('input-error');
            emailInput.style.border = "1px solid #f44336";
            showAlert('warning', 'Email Inválido', 'Por favor, digite um endereço de email válido.');
            return;
        }

        if (camposInvalidos) {
            showAlert('warning', 'Campos Obrigatórios', 'Por favor, preencha todos os campos para continuar.');
            return;
        }

        showLoader();

        try {
            const resposta = await fetch("/diretoria/autenticar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            });

            hideLoader();

            if (resposta.status === 200) {
                const dados = await resposta.json();

                sessionStorage.setItem("ID_DIRETOR", dados.id);
                sessionStorage.setItem("NOME_DIRETOR", dados.nome);
                sessionStorage.setItem("EMAIL_DIRETOR", dados.email);
                sessionStorage.setItem("FK_UNIVERSIDADE", dados.universidade);

                // Mostrar alert de sucesso
                showAlert(
                    'success',
                    'Login realizado!',
                    `Bem-vindo de volta, ${dados.nome}! Redirecionando para o dashboard...`,
                    "/dashboard/dashboard.html"
                );

                // Redirecionar após 3 segundos (fallback)
                if(dados.id == 1){
                    setTimeout(() => {
                        window.location.href = "/dashboard/dashboard.html";
                    }, 3000);
                }   else{
                    setTimeout(() => {
                        window.location.href = "/dashboard/alunos.html";
                    }, 3000);
                }

            } else if (resposta.status === 401) {
                showAlert('error', 'Acesso Negado', 'Email ou senha inválidos. Verifique suas credenciais e tente novamente.');
                erroDiv.style.color = "red";
                erroDiv.innerText = "Email ou senha inválidos.";
                // Aplicar efeito de erro nos campos
                emailInput.classList.add('input-error');
                senhaInput.classList.add('input-error');
            } else if (resposta.status === 404) {
                showAlert('error', 'Usuário não encontrado', 'Não encontramos uma conta com este email. Por favor, verifique ou cadastre-se.');
                erroDiv.style.color = "red";
                erroDiv.innerText = "Usuário não encontrado.";
                emailInput.classList.add('input-error');
            } else {
                const msg = await resposta.text();
                showAlert('error', 'Erro no Login', `Ocorreu um erro ao tentar fazer login: ${msg}`);
                erroDiv.style.color = "red";
                erroDiv.innerText = "Erro: " + msg;
            }

        } catch (erro) {
            console.error(erro);
            hideLoader();
            showAlert('error', 'Erro de Conexão', 'Não foi possível conectar ao servidor. Verifique sua conexão com a internet e tente novamente.');
            erroDiv.style.color = "red";
            erroDiv.innerText = "Não foi possível conectar ao servidor.";
        }
    }

    // Remover borda vermelha quando o usuário começar a digitar
    emailInput.addEventListener('input', function () {
        this.classList.remove('input-error');
        this.style.border = "";
        erroDiv.innerHTML = "";
    });

    senhaInput.addEventListener('input', function () {
        this.classList.remove('input-error');
        this.style.border = "";
        erroDiv.innerHTML = "";
    });

    // Função do olhinho
    function toggleSenha(icon) {
        const senha = document.getElementById('senha_input');
        if (senha.type === 'password') {
            senha.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            senha.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    // Permitir login com tecla Enter
    emailInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            entrar();
        }
    });

    senhaInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            entrar();
        }
    });

    // Permitir fechar alert com ESC
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeAlert();
        }
    });

    // Reset do onclick do botão quando o alert for fechado normalmente
    function closeAlert() {
        document.getElementById('customAlert').classList.remove('active');
        const closeBtn = document.querySelector('#customAlert .alert-btn.primary');
        closeBtn.onclick = closeAlert;
    }

    // Fechar alert ao clicar fora
    document.getElementById('customAlert').addEventListener('click', function (e) {
        if (e.target === this) {
            closeAlert();
        }
    });
</script>

</html>
