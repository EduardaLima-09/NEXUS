<!--CADASTRO EMPRESA-->
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <title>Nexus | Cadastro Instituição</title>
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>
    <main class="cadastro_container">
        <!-- LADO ESQUERDO -->
        <div class="lado_esquerdo">
            <div class="grupo_voltar">
                <a href="./index.html" class="botao_de_voltar">
                    <span class="seta">
                        <i class="fa-solid fa-arrow-left"></i>
                    </span>
                </a>
                <span class="voltar"><a href="./index.html">Voltar</a></span>
            </div>

            <h1>CADASTRE SUA INSTITUIÇÃO</h1>
            <p>Conecte sua instituição à Nexus</p>

            <div class="card-login">
                <div class="linha-dupla">
                    <div class="campo">
                        <label>Nome Fantasia</label>
                        <input type="text" id="nome_input">
                    </div>
                    <div class="campo">
                        <label>Razão Social</label>
                        <input type="text" id="razao_input">
                    </div>
                </div>
                <div class="linha-dupla">
                    <div class="campo">
                        <label>Email Institucional</label>
                        <input type="email" id="email_input">
                    </div>

                    <div class="campo">
                        <label>CNPJ</label>
                        <input type="text" id="cnpj_input">
                    </div>
                </div>
                <div class="linha-dupla">
                    <div class="campo">
                        <label>Telefone</label>
                        <input type="tel" id="telefone_input">
                    </div>
                    <div class="campo">
                        <label>Senha</label>
                        <input type="password" id="senha_input">
                    </div>
                </div>

                <button onclick="cadastrar()">Cadastrar</button>

                <span class="login">
                    Já possui conta? <a href="./login.html">Login</a>
                </span>

                <div id="erro" class="mensagem_senha"></div>

            </div>
        </div>
        <div class="lado_direito">
            <img src="assets/logobrancoNexus.png" class="logo">
            <div class="triangulo_esquerda"></div>
            <div class="triangulo_direita"></div>
            <img src="assets/Cadastro.svg" class="img">
        </div>
    </main>
</body>
</html>
