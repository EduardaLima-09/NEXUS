<!--CADASTRO DIRETOR-->
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/cadastroDiretor.css">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <title>Nexus | Cadastro</title>
  <link rel="shortcut icon" href="assets/favicon (3).ico" type="image/x-icon">
</head>

<body>
  <main class="cadastro_container">
    <!--LADO ESQUERDO-->
    <div class="lado_esquerdo">
      <div class="conteudo_esquerda">
        <img src="assets/LogoBranca.png" class="logo">
        <h1>Bem-vindo, Diretor</h1>
        <p>Gerencie sua instituição com eficiência.</p>
        <span class="descricao">
          Tenha acesso a uma plataforma completa para acompanhar indicadores, organizar processos e impulsionar
          resultados educacionais.
        </span>
      </div>
    </div>
    <!--LADO DIREITO (formulário do diretor)-->
    <div class="lado_direito">
      <div class="grupo_voltar">
        <a href="./index.html" class="botao_de_voltar">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
      </div>
      <div class="card-login">
        <h2>Cadastre-se</h2>
        <div class="linha-dupla">
          <div class="campo">
            <label>Nome</label>
            <input type="text" id="nome_input" placeholder="Seu nome">
          </div>
          <div class="campo">
            <label>Sobrenome</label>
            <input type="text" id="sobrenome_input" placeholder="Seu sobrenome">
          </div>
          <div class="campo">
            <label>Email</label>
            <input type="email" id="email_input" placeholder="empresa@email.com">
          </div>
          <div class="campo">
            <label>Token</label>
            <input type="text" id="token_input" placeholder="******" maxlength="6">
          </div>
          <div class="campo senha-campo">
            <label>Senha</label>
            <div class="input-com-icone">
              <input type="password" id="senha_input" placeholder="**********">
              <i class="fa-solid fa-eye" id="toggle_senha" style="cursor:pointer;"></i>
            </div>
          </div>
          <div class="campo senha-campo">
            <label>Confirmar senha</label>
            <div class="input-com-icone">
              <input type="password" id="confirmacao_senha_input" placeholder="**********">
              <i class="fa-solid fa-eye" id="toggle_confirmacao" style="cursor:pointer;"></i>
            </div>
          </div>
        </div>
        <button onclick="cadastrar()">Cadastrar diretor</button>
        <span class="sub">
          Já possui conta? <a href="./login.html">Login</a>
        </span>
        <div id="erro_senha" class="mensagem_senha"></div>
        <div id="erro_confirmacao" class="mensagem_senha"></div>

        <!-- Alert -->
        <div id="customAlert" class="alerta">
          <div class="alerta-container">
            <div class="alerta-header">
              <div id="alertIcon" class="alerta-icone"></div>
              <h3 id="alertTitle"></h3>
            </div>
            <div class="alerta-mensagem">
              <p id="alertMessage"></p>
              <div id="tokenContainer" style="display: none;"></div>
            </div>
            <div class="alerta-butoes">
              <button class="alert-btn primary" onclick="closeAlert()">OK</button>
            </div>
          </div>
        </div>

        <!--Carregamento-->
        <div id="customLoader" class="carregando">
          <div class="carregando-container">
            <div class="parte-texto"></div>
            <p>Processando cadastro...</p>
          </div>
        </div>
      </div>
  </main>
</body>

<script>
  const nomeInput = document.getElementById("nome_input");
  const sobrenomeInput = document.getElementById("sobrenome_input");
  const emailInput = document.getElementById("email_input");
  const tokenInput = document.getElementById("token_input");
  const senhaInput = document.getElementById("senha_input");
  const confirmacaoInput = document.getElementById("confirmacao_senha_input");

  const toggleSenha = document.getElementById("toggle_senha");
  const toggleConfirmacao = document.getElementById("toggle_confirmacao");

  // Funções do alert personalizado
  function showAlert(type, title, message, redirectUrl = null) {
    const alert = document.getElementById('customAlert');
    const alertIcon = document.getElementById('alertIcon');
    const alertTitle = document.getElementById('alertTitle');
    const alertMessage = document.getElementById('alertMessage');

    // Configurar ícone e cor baseado no tipo, resolve essa parte no css também
    alertIcon.innerHTML = '';
    if (type === 'success') {
      alertIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
      alertIcon.className = 'alerta-icone success';
    } else if (type === 'error') {
      alertIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      alertIcon.className = 'alerta-icone error';
    } else if (type === 'warning') {
      alertIcon.innerHTML = '<i class="fa-solid fa-exclamation"></i>';
      alertIcon.className = 'alerta-icone warning';
    } else {
      alertIcon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';
      alertIcon.className = 'alerta-icone info';
    }

    alertTitle.textContent = title;
    alertMessage.textContent = message;

    alert.classList.add('active');

    // Se tiver URL de redirecionamento, redirecionar após fechar
    if (redirectUrl) {
      const closeBtn = document.querySelector('#customAlert .alert-btn.primary');
      const oldClick = closeBtn.onclick;
      closeBtn.onclick = () => {
        if (oldClick) oldClick();
        window.location.href = redirectUrl;
      };
    }
  }

  function showLoader() {
    document.getElementById('customLoader').classList.add('active');
  }

  function hideLoader() {
    document.getElementById('customLoader').classList.remove('active');
  }

  function closeAlert() {
    document.getElementById('customAlert').classList.remove('active');
  }


  // Olhinhos
  toggleSenha.addEventListener("click", () => {
    if (senhaInput.type === "password") {
      senhaInput.type = "text";
      toggleSenha.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      senhaInput.type = "password";
      toggleSenha.classList.replace("fa-eye-slash", "fa-eye");
    }
  });

  toggleConfirmacao.addEventListener("click", () => {
    if (confirmacaoInput.type === "password") {
      confirmacaoInput.type = "text";
      toggleConfirmacao.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      confirmacaoInput.type = "password";
      toggleConfirmacao.classList.replace("fa-eye-slash", "fa-eye");
    }
  });

  function criarErro(input) {
    let erro = document.createElement("div");
    erro.className = "mensagem_senha";
    erro.style.color = "red";
    erro.style.fontSize = "12px";
    input.parentNode.appendChild(erro);
    return erro;
  }

  const erroNome = criarErro(nomeInput);
  const erroSobrenome = criarErro(sobrenomeInput);
  const erroEmail = criarErro(emailInput);
  const erroToken = criarErro(tokenInput);
  const erroSenha = criarErro(senhaInput);
  const erroConfirmacao = criarErro(confirmacaoInput);

  // ================= TOKEN =================
  tokenInput.addEventListener("input", function () {
    // Permite letras e números, limita a 6 caracteres
    this.value = this.value.replace(/[^a-zA-Z0-9]/g, "").slice(0, 6).toUpperCase();
  });

  // ================= VALIDAÇÃO SENHA =================
  function validarSenha() {
    let senha = senhaInput.value;
    let erros = [];

    let temMaiuscula = false;
    let temNumero = false;
    let temEspecial = false;

    for (let i = 0; i < senha.length; i++) {
      let c = senha[i];
      if (c >= "A" && c <= "Z") temMaiuscula = true;
      if (c >= "0" && c <= "9") temNumero = true;
      if ("!@#$%&*".includes(c)) temEspecial = true;
    }

    if (senha.length < 8) {
      erros.push("Mínimo de 8 caracteres");
    }

    if (!temMaiuscula) {
      erros.push("1 letra maiúscula");
    }

    if (!temNumero) {
      erros.push("1 número");
    }

    if (!temEspecial) {
      erros.push("1 caractere especial (!@#$%&*)");
    }

    if (erros.length > 0) {
      erroSenha.style.color = "red";
      erroSenha.innerHTML = "Falta: " + erros.join(", ");
      return false;
    } else {
      erroSenha.style.color = "green";
      erroSenha.innerHTML = "Senha forte ✔";
      return true;
    }
  }

  // ================= VALIDAÇÃO CONFIRMAÇÃO ================= //
  function validarConfirmacao() {
    let senhaValida = validarSenha();

    if (confirmacaoInput.value !== senhaInput.value) {
      erroConfirmacao.style.color = "red";
      erroConfirmacao.innerHTML = "As senhas não coincidem.";
      return false;
    }

    if (!senhaValida) {
      erroConfirmacao.style.color = "red";
      erroConfirmacao.innerHTML = "Corrija a senha primeiro.";
      return false;
    }

    if (confirmacaoInput.value === "") {
      erroConfirmacao.innerHTML = "";
      return false;
    }

    erroConfirmacao.style.color = "green";
    erroConfirmacao.innerHTML = "As senhas coincidem ✔";
    return true;
  }

  senhaInput.addEventListener("input", validarSenha);
  confirmacaoInput.addEventListener("input", validarConfirmacao);

  // ================= CADASTRAR ================= //
  async function cadastrar() {
    let valido = true;

    if (nomeInput.value.trim() === "") {
      erroNome.innerHTML = "Digite seu nome.";
      valido = false;
    } else erroNome.innerHTML = "";

    if (sobrenomeInput.value.trim() === "") {
      erroSobrenome.innerHTML = "Digite seu sobrenome.";
      valido = false;
    } else erroSobrenome.innerHTML = "";

    if (!emailInput.value.includes("@")) {
      erroEmail.innerHTML = "Email inválido.";
      valido = false;
    } else erroEmail.innerHTML = "";

    if (tokenInput.value.trim().length !== 6) {
      erroToken.innerHTML = "Token deve ter 6 caracteres.";
      valido = false;
    } else erroToken.innerHTML = "";

    if (!validarSenha()) valido = false;
    if (!validarConfirmacao()) valido = false;

    if (valido) {
      showLoader();

      try {
        const resposta = await fetch("http://localhost:3333/diretoria/cadastrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nomeServer: nomeInput.value.trim(),
            sobrenomeServer: sobrenomeInput.value.trim(),
            emailServer: emailInput.value.trim(),
            tokenServer: tokenInput.value.trim().toUpperCase(),
            senhaServer: senhaInput.value
          })
        });

        hideLoader();

        if (resposta.status === 201) {
          // Mostrar alert de sucesso e redirecionar
          showAlert('success', 'Cadastro Realizado!', 'Cadastro realizado com sucesso! Redirecionando para o login...', 'login.html');

          // Redirecionar após 3 segundos caso o alert não redirecione
          setTimeout(() => {
            window.location.href = "login.html";
          }, 3000);
        } else if (resposta.status === 404) {
          erroToken.style.color = "red";
          erroToken.innerHTML = "Token inválido! Verifique o token da sua instituição.";
          showAlert('error', 'Token Inválido', 'O token informado não é válido. Verifique com sua instituição e tente novamente.');
        } else if (resposta.status === 409) {
          const msg = await resposta.text();
          if (msg.includes("email")) {
            showAlert('error', 'Email já cadastrado', 'Este email já está vinculado a um diretor. Use outro email ou faça login.');
            erroEmail.innerHTML = "Email já cadastrado";
          } else {
            showAlert('error', 'Erro no Cadastro', msg);
          }
        } else {
          const msg = await resposta.text();
          showAlert('error', 'Erro no Cadastro', `Erro ao cadastrar: ${msg}`);
        }
      } catch (erro) {
        hideLoader();
        console.error(erro);
        showAlert('error', 'Erro de Conexão', 'Não foi possível conectar ao servidor. Verifique sua conexão e tente novamente.');
      }
    } else {
      // Mostrar alerta de validação
      showAlert('warning', 'Campos Inválidos', 'Por favor, preencha todos os campos corretamente antes de continuar.');
    }
  }

  // Permitir fechar alert com ESC
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeAlert();
    }
  });

  // Fechar alert ao clicar fora
  document.getElementById('customAlert').addEventListener('click', function (e) {
    if (e.target === this) {
      closeAlert();
    }
  });
</script>

</html>
