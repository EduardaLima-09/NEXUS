<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" />

  <link rel="shortcut icon" href="assets/favicon (3).ico" type="image/x-icon">

<body onload="listar()">
  <main class="cadastro_container">
    <!--Lado do formulário-->
    <div class="lado_esquerdo">
      <div class="grupo_voltar">
        <a href="./index.html" class="botao_de_voltar">

        </a>
        <span class="voltar"><a href="./index.html">Voltar</a></span>

      <h1>CADASTRE-SE</h1>

      <div class="card-login">
        <div class="linha-dupla">
          <div class="campo">
            <label>Nome</label>
            <input type="text" id="nome_input" placeholder="Seu nome">
          </div>
          <div class="campo">
            <label>Sobrenome</label>
            <input type="text" id="sobrenome_input" placeholder="Seu sobrenome">
          </div>
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label>Email</label>

</html>

<!-- ================= MÁSCARA CNPJ ================= -->
<script>
  const cnpjInput = document.getElementById("cnpj_input");
  cnpjInput.addEventListener("input", function () {
    let valor = cnpjInput.value;
    let somenteNumeros = "";
    for (let i = 0; i < valor.length; i++) {
      if (valor[i] >= "0" && valor[i] <= "9") {
        somenteNumeros += valor[i];
      }
    }
    if (somenteNumeros.length > 14) {
      let limite = "";
      for (let i = 0; i < 14; i++) {
        limite += somenteNumeros[i];
      }
      somenteNumeros = limite;
    }
    let formatado = "";
    for (let i = 0; i < somenteNumeros.length; i++) {
      if (i == 2 || i == 5) formatado += ".";
      if (i == 8) formatado += "/";
      if (i == 12) formatado += "-";
      formatado += somenteNumeros[i];
    }
    cnpjInput.value = formatado;
  });
</script>

<!-- ================= MÁSCARA TELEFONE ================= -->
<script>
  const telefoneInput = document.getElementById("telefone_input");
  telefoneInput.addEventListener("input", function () {
    let valor = telefoneInput.value;
    let somenteNumeros = "";
    for (let i = 0; i < valor.length; i++) {
      if (valor[i] >= "0" && valor[i] <= "9") {
        somenteNumeros += valor[i];
      }
    }
    if (somenteNumeros.length > 11) {
      let limite = "";
      for (let i = 0; i < 11; i++) {
        limite += somenteNumeros[i];
      }
      somenteNumeros = limite;
    }
    let formatado = "";
    for (let i = 0; i < somenteNumeros.length; i++) {
      if (i == 0) formatado += "(";
      if (i == 2) formatado += ") ";
      if (i == 7) formatado += "-";
      formatado += somenteNumeros[i];
    }
    telefoneInput.value = formatado;
  });
</script>

<!-- ================= VALIDAÇÃO SENHA ================= -->
<script>
  const senhaInput = document.getElementById("senha_input");
  const erroSenha = document.getElementById("erro_senha");

  senhaInput.addEventListener("input", function () {
    let senha = senhaInput.value;
    let temMaiuscula = false;
    let temNumero = false;
    let temEspecial = false;

    for (let i = 0; i < senha.length; i++) {
      let caractere = senha[i];
      if (caractere >= "A" && caractere <= "Z") temMaiuscula = true;
      if (caractere >= "0" && caractere <= "9") temNumero = true;
      if (
        caractere == "!" || caractere == "@" || caractere == "#" ||
        caractere == "$" || caractere == "%" || caractere == "&" ||
        caractere == "*"
      ) temEspecial = true;
    }

    if (senha.length < 8) {
      erroSenha.style.color = "red";
      erroSenha.innerHTML = "A senha deve ter no mínimo 8 caracteres.";
    } else if (!temMaiuscula) {
      erroSenha.style.color = "red";
      erroSenha.innerHTML = "A senha precisa ter pelo menos 1 letra maiúscula.";
    } else if (!temNumero) {
      erroSenha.style.color = "red";
      erroSenha.innerHTML = "A senha precisa ter pelo menos 1 número.";
    } else if (!temEspecial) {
      erroSenha.style.color = "red";
      erroSenha.innerHTML = "A senha precisa ter 1 caractere especial (!@#$%&*).";
    } else {
      erroSenha.style.color = "green";
      erroSenha.innerHTML = "Senha válida!";
    }
  });
</script>

<!-- ================= CADASTRAR ================= -->
<script>
  // Preenche o token automaticamente se vier da tela anterior
  window.onload = function () {
    const tokenSalvo = sessionStorage.getItem("tokenUniversidade");
    if (tokenSalvo) {
      document.getElementById("token_input").value = tokenSalvo;
    }
  };

  async function cadastrar() {
    const nomeInput = document.getElementById("nome_input");
    const sobrenomeInput = document.getElementById("sobrenome_input");
    const emailInput = document.getElementById("email_input");
    const tokenInput = document.getElementById("token_input");
    const confirmacaoInput = document.getElementById("confirmacao_senha_input");
    const erroConfirmacao = document.getElementById("erro_confirmacao");

    let valido = true;

    // Validação nome
    if (nomeInput.value.trim() === "") {
      valido = false;
      alert("Digite seu nome.");
    }

    // Validação sobrenome
    if (sobrenomeInput.value.trim() === "") {
      valido = false;
      alert("Digite seu sobrenome.");
    }

    // Validação email
    if (!emailInput.value.includes("@")) {
      valido = false;
      alert("Email inválido.");
    }

    // Validação token
    if (tokenInput.value.trim().length !== 6) {
      valido = false;
      alert("Token deve ter 6 caracteres.");
    }

    // Validação confirmação de senha
    if (confirmacaoInput.value !== senhaInput.value) {
      valido = false;
      erroConfirmacao.style.color = "red";
      erroConfirmacao.innerHTML = "As senhas não coincidem.";
    } else {
      erroConfirmacao.innerHTML = "";
    }

    // Validação da senha (garante que está válida antes de enviar)
    let senha = senhaInput.value;
    let temMaiuscula = false, temNumero = false, temEspecial = false;
    for (let i = 0; i < senha.length; i++) {
      let c = senha[i];
      if (c >= "A" && c <= "Z") temMaiuscula = true;
      if (c >= "0" && c <= "9") temNumero = true;
      if ("!@#$%&*".includes(c)) temEspecial = true;
    }
    if (senha.length < 8 || !temMaiuscula || !temNumero || !temEspecial) {
      valido = false;
    }

    if (valido) {
      try {
        const resposta = await fetch("http://localhost:3333/diretoria/cadastrar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nomeServer: nomeInput.value.trim(),
            sobrenomeServer: sobrenomeInput.value.trim(),
            emailServer: emailInput.value.trim(),
            tokenServer: tokenInput.value.trim().toUpperCase(),
            senhaServer: senhaInput.value
          })
        });

        if (resposta.status === 201) {
          sessionStorage.removeItem("tokenUniversidade");
          alert("Cadastro realizado com sucesso!");
          window.location.href = "login.html";
        } else if (resposta.status === 404) {
          alert("Token inválido! Verifique o token da sua instituição.");
        } else {
          const msg = await resposta.text();
          alert("Erro ao cadastrar: " + msg);
        }
      } catch (erro) {
        console.error(erro);
        alert("Não foi possível conectar ao servidor.");
      }
    }
  }
</script>
