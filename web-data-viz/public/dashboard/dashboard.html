<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <title>Nexus | Dashboard</title>
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>

    <div class="tela">
        <div class="dash">
            <div class="barra">
                <div class="logo">
                    <img src="../assets/logobranco - Editado 2.png" alt="">
                </div>
                <div class="menu">
                    <div class="titulo">
                        <h1>Menu</h1>
                    </div>
                    <div class="botoes">
                        <button onclick="goDash()">Home</button>
                        <button onclick="goAlunos()">Alunos</button>
                        <button onclick="goCursos()">Cursos</button>
                        <button onclick="goPainel()">Painel Admin</button>
                    </div>
                </div>
                <div class="sair">
                    <div class="usuario">
                        <img src="../assets/user.png" alt="">
                        <div class="nome">
                            <h1>Admin</h1>
                            <p>Usuário * Nexus</p>
                        </div>
                    </div>
                    <button onclick="goHome()">Sair</button>
                </div>
            </div>
            <div class="conteudo">
                <div class="tituloDash">
                    <h1>Visão Geral - Dashboard</h1>
                    <p>Instituição privada</p>
                </div>
                <div class="conteudo2">
                    <div class="insights">
                        <div class="cards">
                            <h3>KPI 1</h3>
                            <h1>10,5%</h1>
                            <div class="porcentagem">
                                <img src="../assets/down-arrow.png" alt="">
                                <p>5% abaixo do semestre anterior</p>
                            </div>
                        </div>
                        <div class="cards">
                            <h3>KPI 2</h3>
                            <h1>30,3%</h1>
                            <div class="porcentagem">
                                <img src="../assets/up-arrow.png" alt="">
                                <p>5% acima do semestre anterior</p>
                            </div>
                        </div>
                        <div class="cards">
                            <h3>KPI 3</h3>
                            <h1>50,7%</h1>
                            <div class="porcentagem">
                                <img src="../assets/up-arrow.png" alt="">
                                <p>10% acima do semestre anterior</p>
                            </div>
                        </div>
                    </div>
                    <div class="graficos">
                        <div class="metade1">
                            <div class="graficoLinha">
                                <h3>Gráfico 1</h3>
                                <div class="chart-container">
                                    <canvas id="mychart1"></canvas>
                                </div>
                            </div>
                            <div class="graficoBarra">
                                <h3>Gráfico 2</h3>
                                <div class="chart-container">
                                    <canvas id="mychart2"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="metade2">
                            <h3>Gráfico 3</h3>
                            <div class="chart-container g3">
                                <canvas id="mychart3"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>

<script>

    function goDash() {
        window.location.href = "dashboard.html";
    }

    function goAlunos() {
        window.location.href = "alunos.html";
    }
    function goCursos() {
        window.location.href = "cursos.html";
    }
    function goPainel() {
        window.location.href = "painel.html";
    }
    function goHome() {
        window.location.href = "../index.html";
    }

const ctx = document.getElementById('mychart1');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun'],
        datasets: [{
            label: 'Vendas',
            data: [12, 19, 3, 5, 2, 10],
            borderWidth: 2,
            fill: false,
            tension: 0.3
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                display: true
            }
        }
    }
});

const ctx2 = document.getElementById('mychart2');

new Chart(ctx2, {
    type: 'bar',
    data: {
        labels: ['Curso A', 'Curso B', 'Curso C', 'Curso D'],
        datasets: [{
            label: 'Alunos',
            data: [30, 50, 20, 40],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: 'y'
    }
});

const ctx3 = document.getElementById('mychart3');

new Chart(ctx3, {
    type: 'doughnut',
    data: {
        labels: ['Evasão', 'Ativos', 'Concluídos'],
        datasets: [{
            data: [15, 60, 25],
            backgroundColor: [
                '#012340',
                '#4681A6',
                '#8AB4A1'
            ],
            borderColor: '#00000',
            borderWidth: 5
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '60%',

        plugins: {
            legend: {
                position: 'bottom',
                labels: {
                    generateLabels: function(chart) {
                        const original = Chart.overrides.doughnut.plugins.legend.labels.generateLabels;
                        const labels = original(chart);

                        labels.forEach(label => {
                            label.lineWidth = 0; // 👈 remove borda só da legenda
                        });

                        return labels;
                    }
                }
            }
        }
    }
});

</script>
