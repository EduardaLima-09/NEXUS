<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/cursos.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <title>Nexus | Desempenho dos Cursos</title>
    <link rel="shortcut icon" href="../assets/favicon.ico" type="image/x-icon">
</head>

<body>

    <div class="tela">
        <div class="dash">

            <div class="barra">
                <div class="logo">
                    <img src="../assets/LogoBranca.png" alt="Logo Nexus">
                </div>
                <div class="menu">
                    <div class="titulo">
                        <h1>Menu Principal</h1>
                    </div>
                    <div class="botoes">
                        <button id="Alunos" onclick="goAlunos()">Meus Alunos</button>
                        <button id="Cursos" onclick="goCursos()">Cursos</button>
                    </div>
                </div>
                <div class="sair">
                    <div class="usuario">
                        <div class="nome">
                            <div class="titulo-usuario">
                                <h1 id="cargoUsuarioSidebar">Professor</h1>
                            </div>
                            <p id="nomeUsuarioSidebar"></p>
                        </div>
                    </div>
                    <button onclick="goHome()">Sair</button>
                </div>
            </div>

            <div class="conteudo">

                <div class="tituloDash">
                    <div class="texto">
                        <h1>Olá, Professor(a) <span id="nomeUsuario">Usuário</span>!</h1>
                        <p>Análise acadêmica e monitoramento do desempenho dos cursos</p>
                    </div>
                </div>

                <div class="conteudo2">

                    <div class="insights">

                        <div class="cards">
                            <h3>Curso com Risco Elevado</h3>
                            <h1 id="cursoMaiorRisco">-</h1>
                            <div class="porcentagem">
                                <p id="textoMetaMaiorRisco" style="font-size:12px; color:#666;"></p>
                                <div style="width:100%; height:6px; background:#e5e7eb; border-radius:4px; margin:4px 0;">
                                    <div id="progressoMaiorRisco" style="height:100%; width:0%; border-radius:4px; background:#ef4444; transition:width 0.5s;"></div>
                                </div>
                                <span id="percentualMaiorRisco" style="font-size:11px; color:#888;"></span>
                            </div>
                        </div>

                        <div class="cards">
                            <h3>Curso com Risco Baixo</h3>
                            <h1 id="cursoMenorRisco">-</h1>
                            <div class="porcentagem">
                                <p id="textoMetaMenorRisco" style="font-size:12px; color:#666;"></p>
                                <div style="width:100%; height:6px; background:#e5e7eb; border-radius:4px; margin:4px 0;">
                                    <div id="progressoMenorRisco" style="height:100%; width:0%; border-radius:4px; background:#22c55e; transition:width 0.5s;"></div>
                                </div>
                                <span id="percentualMenorRisco" style="font-size:11px; color:#888;"></span>
                            </div>
                        </div>

                    </div>

                    <div class="conteudo3">

                        <div class="graficoBarra">
                            <h3>Quantidade de alunos por nível de risco em cada curso</h3>
                            <div class="chart-container">
                                <canvas id="mychart1"></canvas>
                            </div>
                        </div>

                        <div class="detalhes">
                            <div class="lista-cursos">
                                <h3>Relação de Cursos</h3>
                                <div class="filtro-cursos">
                                    <input type="text" id="pesquisaCurso" class="barra-pesquisa-curso"
                                        placeholder="Buscar curso por nome..." oninput="filtrarListaCursos()">
                                </div>
                                <div id="listaCursosContainer" class="cursos-container"></div>
                            </div>
                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

    <script>

        const cargoUsuario   = sessionStorage.getItem("CARGO_USUARIO");
        const nomeUsuario    = sessionStorage.getItem("NOME_USUARIO") || "Usuário";
        const fkUniversidade = sessionStorage.getItem("FK_UNIVERSIDADE");

        if (cargoUsuario && cargoUsuario !== "Professor") {
            window.location.href = cargoUsuario === "Coordenador"
                ? "dashboard.html" : "../login.html";
        }

        document.getElementById("nomeUsuarioSidebar").innerText  = nomeUsuario;
        document.getElementById("nomeUsuario").innerText         = nomeUsuario;
        document.getElementById("cargoUsuarioSidebar").innerText = cargoUsuario || "Professor";

        function goAlunos() { window.location.href = "alunos.html"; }
        function goCursos() { window.location.href = "cursos.html"; }
        function goHome()   { sessionStorage.clear(); window.location.href = "../index.html"; }

        const paginaAtual = window.location.pathname.split("/").pop();
        if (paginaAtual === "alunos.html") document.getElementById("Alunos")?.classList.add("ativo");
        if (paginaAtual === "cursos.html") document.getElementById("Cursos")?.classList.add("ativo");

        let graficoCursos = null;
        let todosCursos   = [];
        let todasMetas    = [];

        // ── METAS ─────────────────────────────────────────────────────────────

        async function carregarMetas() {

            try {

                const resposta = await fetch(
                    `/metas/listar-professor?fkUniversidade=${fkUniversidade}`
                );

                if (!resposta.ok) return;

                todasMetas = await resposta.json();

            } catch (erro) {
                console.error("Erro ao carregar metas:", erro);
            }

        }

        // Retorna metas associadas a um curso específico
        function metasDoCurso(fkCurso) {
            return todasMetas.filter(m => m.fkCurso === fkCurso);
        }

        // ── INIT ──────────────────────────────────────────────────────────────

        async function carregarDados() {

            if (!fkUniversidade) {
                console.warn("FK_UNIVERSIDADE não encontrada.");
                return;
            }

            await carregarMetas();
            await carregarKpis();
            await carregarGrafico();
            await carregarListaCursos();

        }

        // ── KPIs ──────────────────────────────────────────────────────────────

        async function carregarKpis() {

            try {

                const resposta = await fetch(
                    `/cursos/kpis?fkUniversidade=${fkUniversidade}`
                );

                if (!resposta.ok) return;

                const dados = await resposta.json();

                document.getElementById("cursoMaiorRisco").innerText =
                    dados.cursoMaiorRisco || "-";

                document.getElementById("cursoMenorRisco").innerText =
                    dados.cursoMenorRisco || "-";

                const total = dados.totalAlunos || 1;
                const percentualMaior = ((dados.qtdMaiorRisco || 0) / total) * 100;
                const percentualMenor = ((dados.qtdMenorRisco || 0) / total) * 100;

                // Meta de risco alto para cursos
                const metaAlto = todasMetas.find(m => m.categoria === "Risco Alto");

                if (metaAlto) {
                    document.getElementById("textoMetaMaiorRisco").innerText =
                        `Meta "${metaAlto.nome}": manter abaixo de ${metaAlto.porcentagem}%`;
                    const progresso = percentualMaior <= metaAlto.porcentagem
                        ? 100
                        : Math.max(0, 100 - ((percentualMaior - metaAlto.porcentagem) * 5));
                    document.getElementById("progressoMaiorRisco").style.width = progresso + "%";
                    document.getElementById("progressoMaiorRisco").style.backgroundColor =
                        progresso >= 100 ? "#22c55e" : progresso >= 50 ? "#f97316" : "#ef4444";
                    document.getElementById("percentualMaiorRisco").innerText =
                        `${percentualMaior.toFixed(1)}% atual · ${progresso.toFixed(0)}% da meta`;
                } else {
                    document.getElementById("textoMetaMaiorRisco").innerText =
                        "Nenhuma meta definida";
                    document.getElementById("percentualMaiorRisco").innerText =
                        `${percentualMaior.toFixed(1)}% atual`;
                }

                // Meta de risco baixo para cursos
                const metaBaixo = todasMetas.find(m => m.categoria === "Risco Baixo");

                if (metaBaixo) {
                    document.getElementById("textoMetaMenorRisco").innerText =
                        `Meta "${metaBaixo.nome}": atingir ${metaBaixo.porcentagem}%`;
                    const progresso = Math.min((percentualMenor / metaBaixo.porcentagem) * 100, 100);
                    document.getElementById("progressoMenorRisco").style.width = progresso + "%";
                    document.getElementById("progressoMenorRisco").style.backgroundColor =
                        progresso >= 100 ? "#22c55e" : progresso >= 50 ? "#f97316" : "#ef4444";
                    document.getElementById("percentualMenorRisco").innerText =
                        `${percentualMenor.toFixed(1)}% atual · ${progresso.toFixed(0)}% da meta`;
                } else {
                    document.getElementById("textoMetaMenorRisco").innerText =
                        "Nenhuma meta definida";
                    document.getElementById("percentualMenorRisco").innerText =
                        `${percentualMenor.toFixed(1)}% atual`;
                }

            } catch (erro) {
                console.error("Erro ao carregar indicadores:", erro);
            }

        }

        // ── GRÁFICO ───────────────────────────────────────────────────────────

        async function carregarGrafico() {

            try {

                const resposta = await fetch(
                    `/cursos/grafico?fkUniversidade=${fkUniversidade}`
                );

                const dadosGrafico = await resposta.json();

                let maxValor = 0;
                dadosGrafico.forEach(item => {
                    maxValor = Math.max(maxValor, item.alto || 0, item.medio || 0, item.baixo || 0);
                });

                const yMax  = Math.ceil(maxValor * 1.2);
                const labels = dadosGrafico.map(item => item.curso);
                const alto   = dadosGrafico.map(item => item.alto  || 0);
                const medio  = dadosGrafico.map(item => item.medio || 0);
                const baixo  = dadosGrafico.map(item => item.baixo || 0);

                const ctx = document.getElementById("mychart1");
                if (graficoCursos) graficoCursos.destroy();

                graficoCursos = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels,
                        datasets: [
                            {
                                label: "🔴 Risco Elevado",
                                data: alto,
                                backgroundColor: "#ef4444",
                                borderRadius: 6
                            },
                            {
                                label: "🟠 Risco Moderado",
                                data: medio,
                                backgroundColor: "#f97316",
                                borderRadius: 6
                            },
                            {
                                label: "🟢 Risco Baixo",
                                data: baixo,
                                backgroundColor: "#22c55e",
                                borderRadius: 6
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: "top" },
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        return `${context.dataset.label}: ${context.raw} aluno(s)`;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: yMax,
                                ticks: { stepSize: Math.ceil(yMax / 5), precision: 0 }
                            }
                        }
                    }
                });

            } catch (erro) {
                console.error("Erro ao carregar gráfico:", erro);
            }

        }

        // ── LISTA DE CURSOS COM METAS ─────────────────────────────────────────

        async function carregarListaCursos() {

            try {

                const resposta = await fetch(
                    `/cursos/lista?fkUniversidade=${fkUniversidade}`
                );

                todosCursos = await resposta.json();
                renderizarListaCursos(todosCursos);

            } catch (erro) {
                console.error("Erro ao carregar lista de cursos:", erro);
            }

        }

        function renderizarListaCursos(cursos) {

            const container = document.getElementById("listaCursosContainer");
            container.innerHTML = "";

            if (cursos.length === 0) {
                container.innerHTML =
                    '<div class="nenhum-curso">Nenhum curso encontrado.</div>';
                return;
            }

            cursos.forEach(function (curso) {

                let corRisco    = "#22c55e";
                let textoRisco  = "Risco Baixo";

                if (curso.emRisco > 30) {
                    corRisco   = "#ef4444";
                    textoRisco = "Risco Elevado";
                } else if (curso.emRisco > 15) {
                    corRisco   = "#f97316";
                    textoRisco = "Risco Moderado";
                }

                // Metas específicas deste curso
                const metasCurso = metasDoCurso(curso.id);

                const metasHtml = metasCurso.length > 0
                    ? metasCurso.map(function (meta) {

                        const corCategoria =
                            meta.categoria === "Risco Alto"  ? "#ef4444"
                            : meta.categoria === "Risco Médio" ? "#f97316"
                            : "#22c55e";

                        return `
                            <div style="margin-top: 8px; padding: 8px; background: #f9fafb; border-radius: 8px; border-left: 3px solid ${corCategoria};">
                                <div style="font-size: 12px; font-weight: 600; color: ${corCategoria};">
                                    Meta · ${meta.categoria}
                                </div>
                                <div style="font-size: 13px; margin: 2px 0;">${meta.nome}</div>
                                <div style="width:100%; height:5px; background:#e5e7eb; border-radius:3px; margin-top:4px;">
                                    <div style="height:100%; width:${meta.porcentagem}%; border-radius:3px; background:${corCategoria};"></div>
                                </div>
                                <span style="font-size:11px; color:#888;">${meta.porcentagem}% de conclusão definido pelo coordenador</span>
                            </div>
                        `;

                    }).join("")
                    : `<div style="font-size:12px; color:#999; margin-top:6px;">Nenhuma meta definida para este curso.</div>`;

                const cursoDiv = document.createElement("div");
                cursoDiv.className = "curso-item";

                cursoDiv.innerHTML = `
                    <div class="curso-header" onclick="toggleCurso(this.parentElement)">
                        <div class="curso-nome">${curso.nome}</div>
                        <div class="curso-badge" style="background-color: ${corRisco}">${textoRisco}</div>
                        <span class="material-icons curso-toggle">expand_more</span>
                    </div>
                    <div class="curso-info">
                        <div class="info-row">
                            <span class="info-label">Média geral:</span>
                            <span class="info-value">${curso.media || 0}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Presença média:</span>
                            <span class="info-value">${curso.presenca || 0}%</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Alunos em risco:</span>
                            <span class="info-value">${curso.emRisco || 0} (${textoRisco.toLowerCase()})</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Semestre crítico:</span>
                            <span class="info-value">${curso.semestreCritico || "-"}º semestre</span>
                        </div>
                        <div class="progresso-risco">
                            <div class="progress-bar-mini">
                                <div class="progress-mini" style="width: ${Math.min(curso.emRisco || 0, 100)}%; background-color: ${corRisco}"></div>
                            </div>
                            <span class="percentual-texto">${curso.emRisco || 0}% dos alunos</span>
                        </div>
                        <div style="margin-top: 10px; border-top: 1px solid #e5e7eb; padding-top: 8px;">
                            <div style="font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 4px;">
                                Metas do Coordenador para este curso
                            </div>
                            ${metasHtml}
                        </div>
                    </div>
                `;

                container.appendChild(cursoDiv);

            });

        }

        function toggleCurso(elemento) {
            elemento.classList.toggle("expandido");
        }

        function filtrarListaCursos() {
            const texto = document.getElementById("pesquisaCurso").value.toLowerCase();
            const filtrados = todosCursos.filter(c => c.nome.toLowerCase().includes(texto));
            renderizarListaCursos(filtrados);
        }

        carregarDados();

    </script>

</body>

</html>
