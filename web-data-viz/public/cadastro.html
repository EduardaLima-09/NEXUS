<!--CADASTRO-->
<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <title>Nexus | Cadastro</title>
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body onload="listar()">
  <main class="cadastro_container">
    <!--Lado do formulário-->
    <div class="lado_esquerdo">
      <div class="grupo_voltar">
        <a href="./index.html" class="botao_de_voltar">
          <span class="seta">
            <i class="fa-solid fa-arrow-left"></i>
          </span>
        </a>
        <span class="voltar"><a href="./index.html">Voltar</a></span>
      </div>
      <!--Formulário-->
      <h1>CADASTRE-SE</h1>
      <p>Conecte-se a novas oportunidades com a Nexus</p>
      <div class="card-login">
        <div class="linha-dupla">
          <div class="campo">
            <label>Nome</label>
            <input type="text" id="nome_input" placeholder="Seu nome">
          </div>
          <div class="campo">
            <label>Email</label>
            <input type="email" id="email_input" placeholder="meuemail@provedor.com">
          </div>
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label>Senha</label>
            <input type="password" id="senha_input" placeholder="**********">
          </div>
          <div class="campo">
            <label>Confirmar senha</label>
            <input type="password" id="confirmacao_senha_input" placeholder="**********">
          </div>
        </div>
        <div class="linha-dupla">
          <div class="campo">
            <label>Token</label>       
            <input type="text" id="token_input" placeholder="0000">
          </div>
        </div>
        <button onclick="cadastrar()">Cadastrar</button>
        <span class="login">
          Já possui conta? <a href="./login.html">Login</a>
        </span>
        <!--Mensagem de erro de senha-->
        <div id="erro_senha" class="mensagem_senha"></div>
        <div id="erro_confirmacao" class="mensagem_senha"></div>
      </div>
    </div>
    <!--Lado Direito-->
    <div class="lado_direito">
      <!--Logo da Nexus-->
      <img src="assets/logobrancoNexus.png" alt="Logo da Nexus" class="logo">
      <!-- Triângulos decorativos -->
      <div class="triangulo_esquerda"></div>
      <div class="triangulo_direita"></div>
      <img src="assets/Cadastro.svg" alt="Ilustração de login" class="img">
    </div>
  </main>
</body>

</html>
<!--Máscaras para os inputs, pode melhorar, precisa fazer as retrições também, um sistema bem ferrado :)-->


<script>
  // Inputs
  const nomeInput = document.getElementById("nome_input");
  const emailInput = document.getElementById("email_input");
  const senhaInput = document.getElementById("senha_input");
  const confirmacaoInput = document.getElementById("confirmacao_senha_input");
  const tokenInput = document.getElementById("token_input");

  // Criação das mensagens de erro
  function criarErro(input) {
    let erro = document.createElement("div");
    erro.className = "mensagem_senha";
    erro.style.color = "red";
    erro.style.fontSize = "12px";
    input.parentNode.appendChild(erro);
    return erro;
  }

  const erroNome = criarErro(nomeInput);
  const erroEmail = criarErro(emailInput);
  const erroSenha = criarErro(senhaInput);
  const erroConfirmacao = criarErro(confirmacaoInput);
  const erroToken = criarErro(tokenInput);

  // ================= TOKEN =================
  tokenInput.addEventListener("input", function () {
    let valor = tokenInput.value;
    let somenteNumeros = "";

    for (let i = 0; i < valor.length; i++) {
      if (valor[i] >= "0" && valor[i] <= "9") {
        somenteNumeros += valor[i];
      }
    }

    if (somenteNumeros.length > 4) {
      somenteNumeros = somenteNumeros.slice(0, 4);
    }

    tokenInput.value = somenteNumeros;
  });

  // ================= VALIDAÇÃO SENHA =================
  senhaInput.addEventListener("input", validarSenha);
  confirmacaoInput.addEventListener("input", validarConfirmacao);

  function validarSenha() {
    let senha = senhaInput.value;

    let temMaiuscula = false;
    let temMinuscula = false;
    let temNumero = false;

    for (let i = 0; i < senha.length; i++) {
      let c = senha[i];

      if (c >= "A" && c <= "Z") temMaiuscula = true;
      if (c >= "a" && c <= "z") temMinuscula = true;
      if (c >= "0" && c <= "9") temNumero = true;
    }

    if (senha.length < 8) {
      erroSenha.innerHTML = "Mínimo de 8 caracteres.";
      return false;
    } else if (!temMaiuscula) {
      erroSenha.innerHTML = "Precisa de letra maiúscula.";
      return false;
    } else if (!temMinuscula) {
      erroSenha.innerHTML = "Precisa de letra minúscula.";
      return false;
    } else if (!temNumero) {
      erroSenha.innerHTML = "Precisa de número.";
      return false;
    } else {
      erroSenha.innerHTML = "";
      return true;
    }
  }

  function validarConfirmacao() {
    if (confirmacaoInput.value !== senhaInput.value) {
      erroConfirmacao.innerHTML = "As senhas não coincidem.";
      return false;
    } else {
      erroConfirmacao.innerHTML = "";
      return true;
    }
  }

  // ================= CADASTRO =================
  function cadastrar() {
    let valido = true;

    // Nome
    if (nomeInput.value.trim() === "") {
      erroNome.innerHTML = "Digite seu nome.";
      valido = false;
    } else {
      erroNome.innerHTML = "";
    }

    // Email
    if (!emailInput.value.includes("@")) {
      erroEmail.innerHTML = "Email inválido (precisa de @).";
      valido = false;
    } else {
      erroEmail.innerHTML = "";
    }

    // Senha
    if (!validarSenha()) {
      valido = false;
    }

    // Confirmação
    if (!validarConfirmacao()) {
      valido = false;
    }

    // Token
    if (tokenInput.value.length !== 4) {
      erroToken.innerHTML = "O token deve ter 4 números.";
      valido = false;
    } else {
      erroToken.innerHTML = "";
    }

    // Resultado final
    if (valido) {
      alert("Cadastro realizado com sucesso!");
      window.location.href = "login.html";
    }
  }
</script>
